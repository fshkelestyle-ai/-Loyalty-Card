<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <title>بطاقة الولاء</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div id="brandLogoBox" class="brand-logo">★</div>
        <div>
          <strong id="brandTitle">بطاقة الولاء</strong>
          <div id="brandSubtitle" style="font-size:12px;color:var(--muted)">برنامج الولاء</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button id="langToggleBtn" class="btn btn-outline" style="min-height:40px;padding:6px 12px">FR</button>
        <button id="themeToggleBtn" class="btn btn-outline" style="min-height:40px;padding:6px 12px">🌙</button>
      </div>
    </header>

    <div id="modeBanner" class="card" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
      <span id="modeLabel" style="font-size:13px;font-weight:700">وضع تجريبي محلي</span>
      <button id="installPwaBtn" class="btn btn-secondary hidden" style="min-height:36px;padding:4px 12px;font-size:13px">إضافة للشاشة</button>
    </div>

    <main id="customerView"></main>
    <main id="adminView" class="hidden"></main>
  </div>

  <nav class="bottom-nav">
    <button id="navCustomerBtn" class="btn btn-primary" style="width:auto;min-width:130px">بطاقة الزبون</button>
    <button id="navAdminBtn" class="btn btn-outline" style="width:auto;min-width:130px">لوحة المدير</button>
  </nav>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
